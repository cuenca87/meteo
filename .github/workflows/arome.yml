name: Actualizar animación AROME

on:
  schedule:
    # AROME publica ejecución nueva cada 3h (00/03/06/09/12/15/18/21 UTC).
    # Dos pasadas por ejecución del modelo, mismo job (fetch-arome.js solo
    # pide lo que aún falte, ver ese fichero):
    #  - a los 40 min: da tiempo a que Météo-France publique el run, pero a
    #    esa hora solo suele haber ~30h de pronóstico horario disponibles.
    #  - a las 2h40 (horas largas, +31h..+51h, tardan más en publicarse;
    #    confirmado en vivo que a partir de +3h ya está todo el rango) —
    #    justo antes de que el siguiente run (3h después) pase a ser "el
    #    último" y deje de poder completarse este.
    - cron: "40 0,3,6,9,12,15,18,21 * * *"
    - cron: "40 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: arome
        run: npm install geotiff pngjs

      # continue-on-error en los pasos de datos: un fallo transitorio de la
      # API de Météo-France en UNO de los parámetros (visto en vivo:
      # GetCapabilities devolvió el listado sin un parámetro un rato, se
      # recuperó sola en el siguiente ciclo) no debe impedir publicar lo que
      # sí se consiguió del resto — si un paso fallara sin continue-on-error,
      # el job entero abortaría y el paso "Publicar cambios" ni se
      # ejecutaría, perdiendo también los cambios ya conseguidos de esa pasada.
      - name: Descargar y renderizar precipitación
        id: precipitacion
        continue-on-error: true
        working-directory: arome
        env:
          METEOFRANCE_BASIC_AUTH: ${{ secrets.METEOFRANCE_BASIC_AUTH }}
        run: |
          rm -rf data/frames_precipitacion
          node fetch-arome.js precipitacion
          node render-frames.js precipitacion
          rm -rf data/frames_precipitacion

      - name: Descargar y renderizar temperatura
        id: temperatura
        continue-on-error: true
        working-directory: arome
        env:
          METEOFRANCE_BASIC_AUTH: ${{ secrets.METEOFRANCE_BASIC_AUTH }}
        run: |
          rm -rf data/frames_temperatura
          node fetch-arome.js temperatura
          node render-frames.js temperatura
          rm -rf data/frames_temperatura

      - name: Descargar y renderizar nubosidad
        id: nubosidad
        continue-on-error: true
        working-directory: arome
        env:
          METEOFRANCE_BASIC_AUTH: ${{ secrets.METEOFRANCE_BASIC_AUTH }}
        run: |
          rm -rf data/frames_nubosidad
          node fetch-arome.js nubosidad
          node render-frames.js nubosidad
          rm -rf data/frames_nubosidad

      - name: Publicar cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arome/data/png_precipitacion arome/data/png_temperatura arome/data/png_nubosidad
          git diff --cached --quiet || git commit -m "Actualiza animación AROME (precipitación + temperatura + nubosidad)"
          git push

      # Si alguno de los pasos anteriores falló de verdad (no solo un hueco
      # de horas pendiente, eso no es fallo), marcar el job en rojo
      # igualmente para que salte el aviso por correo — continue-on-error
      # solo evita que bloquee el commit, no debe ocultar el fallo.
      - name: Marcar el job como fallido si algún paso de datos falló
        if: steps.precipitacion.outcome == 'failure' || steps.temperatura.outcome == 'failure' || steps.nubosidad.outcome == 'failure'
        run: exit 1
